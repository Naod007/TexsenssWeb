    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Manrope', sans-serif;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Subtle corner accents */
    .og-card::before,
    .og-card::after {
      content: '';
      position: absolute;
      width: 80px;
      height: 80px;
      border-color: #e8f7f8;
      border-style: solid;
    }

    .og-card::before {
      top: 40px;
      left: 40px;
      border-width: 2px 0 0 2px;
    }

    .og-card::after {
      bottom: 40px;
      right: 40px;
      border-width: 0 2px 2px 0;
    }

    .wordmark-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wordmark-wrap svg {
      width: 480px;
      height: auto;
    }

    .tagline {
      margin-top: 28px;
      font-size: 22px;
      color: #8a9ab0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 400;
    }

    .domain {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      color: #b0bec5;
      letter-spacing: 0.06em;
      font-family: 'IBM Plex Mono', monospace;
    }
  </style>
